name: android_ssh_codex
description: A mobile Codex UI that controls a remote Codex app-server over SSH.
version: 0.4.4+19
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  collection: ^1.18.0
  crypto: 3.0.7
  dartssh2: 2.22.2
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_secure_storage: 9.2.4
  flutter_secure_storage_ohos: 1.0.0
  markdown: 7.3.1
  web_socket_channel: 3.0.1

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
