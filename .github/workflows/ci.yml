name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - name: Cache Pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - name: Verify dependency lock
        run: git diff --exit-code -- pubspec.lock
      - name: Test Android signing configuration
        run: |
          bash test/tool/configure_android_signing_test.sh
          bash test/tool/extract_android_cert_sha256_test.sh
          bash test/tool/android_signing_workflow_test.sh
          bash test/tool/android_connection_service_test.sh
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Show formatting diff on failure
        if: failure()
        run: |
          dart format lib test
          git diff -- lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
