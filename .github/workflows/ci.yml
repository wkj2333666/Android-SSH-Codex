name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    name: Windows host regression tests
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PUB_CACHE: C:\pub-cache
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - name: Test native PowerShell transport and host editing
        run: >-
          flutter test --reporter expanded
          test/transport/windows_commands_test.dart
          test/transport/windows_host_test.dart
          test/profiles/host_profile_test.dart
          test/ui/profile_editor_test.dart
          test/projects/remote_project_test.dart
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - name: Cache Pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install fish for SSH login-shell regression tests
        run: sudo apt-get update -qq && sudo apt-get install -y fish openssh-server
      - run: flutter pub get
      - name: Verify dependency lock
        run: git diff --exit-code -- pubspec.lock
      - name: Test Android signing configuration
        run: |
          bash test/tool/configure_android_signing_test.sh
          bash test/tool/extract_android_cert_sha256_test.sh
          bash test/tool/android_signing_workflow_test.sh
          bash test/tool/android_connection_service_test.sh
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Show formatting diff on failure
        if: failure()
        run: |
          dart format lib test
          git diff -- lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Real SSH file download regression
        run: bash tool/test_download_ssh.sh
